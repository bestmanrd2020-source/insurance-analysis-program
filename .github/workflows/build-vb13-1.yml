name: Build VB13-1 Windows EXE

on:
  push:
    branches:
      - vb13-1-build4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.16.0

      - name: Download current V13-21 distribution
        shell: pwsh
        run: |
          $url = 'https://github.com/bestmanrd2020-source/insurance-analysis-program/releases/download/V13-21/V13-21_.EXE._.exe'
          Invoke-WebRequest -Uri $url -OutFile 'original_v13_21.exe'
          if ((Get-Item 'original_v13_21.exe').Length -lt 40000000) { throw 'V13-21 download is unexpectedly small.' }

      - name: Recover verified runtime and source chain
        shell: pwsh
        run: |
          python build_tools/extract_runtime.py original_v13_21.exe legacy_runtime
          New-Item -ItemType Directory -Force -Path app_payload | Out-Null
          $sources = @(
            '분석설계V13-14_해지계약출력제외.py',
            '분석설계V13-15_관리자원격승인.py',
            '분석설계V13-16_RPC오류수정.py',
            '분석설계V13-17_신청일시한국시간표시.py',
            '분석설계V13-18_원격승인배포보완.py',
            '분석설계V13-19_원격승인완성판.py'
          )
          foreach ($name in $sources) {
            Move-Item -LiteralPath (Join-Path 'legacy_runtime' $name) -Destination (Join-Path 'app_payload' $name) -Force
          }
          foreach ($folder in @('assets','templates','guides')) {
            if (Test-Path -LiteralPath (Join-Path 'legacy_runtime' $folder)) {
              Move-Item -LiteralPath (Join-Path 'legacy_runtime' $folder) -Destination (Join-Path 'app_payload' $folder) -Force
            }
          }
          Remove-Item -LiteralPath 'legacy_runtime\python312.dll' -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'legacy_runtime\base_library.zip' -Force -ErrorAction SilentlyContinue
          Write-Host "legacy runtime files:" ((Get-ChildItem legacy_runtime -Recurse -File).Count)
          Write-Host "app payload files:" ((Get-ChildItem app_payload -Recurse -File).Count)

      - name: Build stock-bootloader onefile EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean '분석설계VB13-1.spec'

      - name: Verify PE executable and import smoke test
        shell: pwsh
        run: |
          $exe = 'dist\분석설계VB13-1_윈도우단일EXE배포용.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'EXE was not produced.' }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Not a valid Windows PE file.' }
          $p = Start-Process -FilePath $exe -ArgumentList '--build-smoke-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "VB13-1 smoke test failed with exit code $($p.ExitCode)." }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "EXE size:" (Get-Item -LiteralPath $exe).Length
          Write-Host "SHA256:" $hash
          $hash | Out-File -LiteralPath 'dist\SHA256.txt' -Encoding ascii

      - name: Upload Windows distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: VB13-1-Windows-EXE
          path: |
            dist/분석설계VB13-1_윈도우단일EXE배포용.exe
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 7
