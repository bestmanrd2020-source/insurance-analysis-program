name: Build VB13-1 Windows EXE

on:
  push:
    branches: ["build-vb13-1-windows"]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Download stable V13-14 release EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{
            Accept = 'application/octet-stream'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'VB13-1-Windows-Builder'
          }
          Invoke-WebRequest -Headers $headers -Uri 'https://api.github.com/repos/bestmanrd2020-source/insurance-analysis-program/releases/assets/563018047' -OutFile 'vb13_build\V13-14-source.exe'
          $f = Get-Item 'vb13_build\V13-14-source.exe'
          if ($f.Length -lt 50000000) { throw "Downloaded V13-14 EXE is unexpectedly small: $($f.Length)" }
          Get-FileHash -Algorithm SHA256 $f.FullName

      - name: Prepare build source
        shell: pwsh
        run: |
          cd vb13_build
          python prepare_build.py
          Copy-Item "분석설계VB13-1_윈도우배포판.py" "src\분석설계VB13-1_윈도우배포판.py"
          Copy-Item "분석설계VB13-1_윈도우배포판.spec" "src\분석설계VB13-1_윈도우배포판.spec"
          Copy-Item "requirements-build.txt" "src\requirements-build.txt"

      - name: Install build dependencies
        shell: pwsh
        run: |
          cd vb13_build\src
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Verify recovered modules
        shell: pwsh
        run: |
          cd vb13_build\src
          python -c "import insurance_pdf_parser_v11_15, app_observability, support_center, renewal_writer_engine_v13_3, consultation_report, asset_manager, remote_license_v13_15, remote_license_v13_16; print('custom modules OK')"
          python -c "import importlib.util, pathlib; p=pathlib.Path('analysis_v13_14_compiled.pyc'); s=importlib.util.spec_from_file_location('v14check',p); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); print('V13-14 compiled base OK')"

      - name: Build Windows one-file EXE
        shell: pwsh
        run: |
          cd vb13_build\src
          python -m PyInstaller --clean --noconfirm "분석설계VB13-1_윈도우배포판.spec"
          Get-ChildItem dist

      - name: Smoke test EXE startup
        shell: pwsh
        run: |
          cd vb13_build\src
          $exe = Get-ChildItem -Path dist -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "EXE not found" }
          $stdout = Join-Path $PWD 'startup-stdout.txt'
          $stderr = Join-Path $PWD 'startup-stderr.txt'
          $p = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Host '===== STDOUT ====='
            if (Test-Path $stdout) { Get-Content $stdout -Raw }
            Write-Host '===== STDERR ====='
            if (Test-Path $stderr) { Get-Content $stderr -Raw }
            throw "Built EXE exited during startup test. ExitCode=$($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Get-FileHash -Algorithm SHA256 $exe.FullName

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VB13-1-startup-diagnostics
          path: |
            vb13_build/src/startup-stdout.txt
            vb13_build/src/startup-stderr.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload Windows EXE artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VB13-1-Windows-EXE
          path: vb13_build/src/dist/*.exe
          if-no-files-found: error
          retention-days: 7
